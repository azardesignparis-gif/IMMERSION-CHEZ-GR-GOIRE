<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Grégoire Azoulay — Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #111;
      overflow-x: hidden;
    }

    #pdf-container {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .pdf-page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
      line-height: 0;
    }

    .pdf-page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .link-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .link-layer a {
      position: absolute;
      display: block;
      pointer-events: auto;
    }

    #error {
      display: none;
      padding: 30px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="pdf-container"></div>
  <div id="error"></div>

  <script type="module">

    import * as pdfjsLib from './pdfjs/pdf.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      './pdfjs/pdf.worker.mjs';

    const container =
      document.getElementById('pdf-container');

    const errorBox =
      document.getElementById('error');


    function transformPoint(x, y, transform) {

      return [
        transform[0] * x +
        transform[2] * y +
        transform[4],

        transform[1] * x +
        transform[3] * y +
        transform[5]
      ];

    }


    async function loadPDF() {

      const loadingTask = pdfjsLib.getDocument({
        url: './IMMERSION_CHEZ_GREGOIRE.pdf'
      });

      const pdf = await loadingTask.promise;


      for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
      ) {

        const page =
          await pdf.getPage(pageNumber);

        const originalViewport =
          page.getViewport({ scale: 1 });

        const screenWidth =
          document.documentElement.clientWidth;

        const scale =
          screenWidth / originalViewport.width;

        const viewport =
          page.getViewport({ scale });


        const pageWrapper =
          document.createElement('div');

        pageWrapper.className = 'pdf-page';

        pageWrapper.style.width =
          viewport.width + 'px';

        pageWrapper.style.height =
          viewport.height + 'px';


        const canvas =
          document.createElement('canvas');

        const context =
          canvas.getContext('2d');


        const pixelRatio =
          Math.min(window.devicePixelRatio || 1, 2);


        canvas.width =
          Math.floor(viewport.width * pixelRatio);

        canvas.height =
          Math.floor(viewport.height * pixelRatio);

        canvas.style.width =
          viewport.width + 'px';

        canvas.style.height =
          viewport.height + 'px';


        const linkLayer =
          document.createElement('div');

        linkLayer.className = 'link-layer';


        pageWrapper.appendChild(canvas);
        pageWrapper.appendChild(linkLayer);

        container.appendChild(pageWrapper);


        await page.render({

          canvasContext: context,

          viewport: viewport,

          transform: [
            pixelRatio,
            0,
            0,
            pixelRatio,
            0,
            0
          ]

        }).promise;


        const annotations =
          await page.getAnnotations();


        for (const annotation of annotations) {

          if (
            annotation.subtype !== 'Link' ||
            !annotation.rect ||
            !annotation.url
          ) {
            continue;
          }


          const point1 = transformPoint(
            annotation.rect[0],
            annotation.rect[1],
            viewport.transform
          );

          const point2 = transformPoint(
            annotation.rect[2],
            annotation.rect[3],
            viewport.transform
          );


          const left =
            Math.min(point1[0], point2[0]);

          const top =
            Math.min(point1[1], point2[1]);

          const width =
            Math.abs(point2[0] - point1[0]);

          const height =
            Math.abs(point2[1] - point1[1]);


          const link =
            document.createElement('a');


          link.href = annotation.url;

          link.target = '_self';


          link.style.left =
            left + 'px';

          link.style.top =
            top + 'px';

          link.style.width =
            width + 'px';

          link.style.height =
            height + 'px';


          linkLayer.appendChild(link);

        }

      }

    }


    loadPDF().catch(error => {

      console.error(error);

      errorBox.style.display = 'block';

      errorBox.textContent =
        'Erreur : ' +
        (error.message || String(error));

    });

  </script>

</body>
</html>
