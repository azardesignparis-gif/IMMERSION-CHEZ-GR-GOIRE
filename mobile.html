<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grégoire Azoulay — Portfolio</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #111;
      overflow-x: hidden;
    }

    #pdf-container {
      width: 100%;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .annotation-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .annotation-layer a {
      position: absolute;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <div id="pdf-container"></div>

  <script type="module">

    import * as pdfjsLib from './pdfjs/pdf.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.mjs';

    const container = document.getElementById('pdf-container');

    const loadingTask =
      pdfjsLib.getDocument('./IMMERSION_CHEZ_GREGOIRE.pdf');

    const pdf = await loadingTask.promise;

    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

      const page = await pdf.getPage(pageNumber);

      const baseViewport = page.getViewport({ scale: 1 });

      const scale =
        document.documentElement.clientWidth /
        baseViewport.width;

      const viewport = page.getViewport({ scale });

      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';

      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');

      const pixelRatio = window.devicePixelRatio || 1;

      canvas.width =
        Math.floor(viewport.width * pixelRatio);

      canvas.height =
        Math.floor(viewport.height * pixelRatio);

      canvas.style.width =
        viewport.width + 'px';

      canvas.style.height =
        viewport.height + 'px';

      pageDiv.style.height =
        viewport.height + 'px';

      pageDiv.appendChild(canvas);

      const annotationLayer =
        document.createElement('div');

      annotationLayer.className =
        'annotation-layer';

      pageDiv.appendChild(annotationLayer);

      container.appendChild(pageDiv);

      await page.render({
        canvasContext: context,
        viewport: viewport,
        transform: [
          pixelRatio,
          0,
          0,
          pixelRatio,
          0,
          0
        ]
      }).promise;

      const annotations =
        await page.getAnnotations();

      for (const annotation of annotations) {

        if (
          annotation.subtype !== 'Link' ||
          !annotation.rect ||
          !annotation.url
        ) {
          continue;
        }

        const rect =
          viewport.convertToViewportRectangle(
            annotation.rect
          );

        const left =
          Math.min(rect[0], rect[2]);

        const top =
          Math.min(rect[1], rect[3]);

        const width =
          Math.abs(rect[2] - rect[0]);

        const height =
          Math.abs(rect[3] - rect[1]);

        const link =
          document.createElement('a');

        link.href = annotation.url;
        link.target = '_self';

        link.style.left = left + 'px';
        link.style.top = top + 'px';
        link.style.width = width + 'px';
        link.style.height = height + 'px';

        annotationLayer.appendChild(link);
      }
    }

  </script>

</body>
</html>
