<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Grégoire Azoulay — Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #111;
      overflow-x: hidden;
    }

    #pdf-container {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .pdf-page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
      line-height: 0;
    }

    .pdf-page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .link-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .link-layer a {
      position: absolute;
      display: block;
    }
  </style>
</head>

<body>

  <div id="pdf-container"></div>

  <script type="module">

    import * as pdfjsLib from './pdfjs/pdf.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.mjs';

    const container = document.getElementById('pdf-container');

    async function loadPDF() {

      const pdf = await pdfjsLib.getDocument(
        './IMMERSION_CHEZ_GREGOIRE.pdf'
      ).promise;

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

        const page = await pdf.getPage(pageNumber);

        const originalViewport = page.getViewport({ scale: 1 });

        const screenWidth = window.innerWidth;

        const scale = screenWidth / originalViewport.width;

        const viewport = page.getViewport({ scale: scale });

        const pageWrapper = document.createElement('div');
        pageWrapper.className = 'pdf-page';
        pageWrapper.style.height = viewport.height + 'px';

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        const pixelRatio = window.devicePixelRatio || 1;

        canvas.width = Math.floor(viewport.width * pixelRatio);
        canvas.height = Math.floor(viewport.height * pixelRatio);

        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';

        pageWrapper.appendChild(canvas);

        const linkLayer = document.createElement('div');
        linkLayer.className = 'link-layer';

        pageWrapper.appendChild(linkLayer);
        container.appendChild(pageWrapper);

        await page.render({
          canvasContext: context,
          viewport: viewport,
          transform: [
            pixelRatio,
            0,
            0,
            pixelRatio,
            0,
            0
          ]
        }).promise;

        const annotations = await page.getAnnotations();

        for (const annotation of annotations) {

          if (
            annotation.subtype !== 'Link' ||
            !annotation.rect ||
            !annotation.url
          ) {
            continue;
          }

          const rect =
            viewport.convertToViewportRectangle(annotation.rect);

          const left = Math.min(rect[0], rect[2]);
          const top = Math.min(rect[1], rect[3]);
          const width = Math.abs(rect[2] - rect[0]);
          const height = Math.abs(rect[3] - rect[1]);

          const link = document.createElement('a');

          link.href = annotation.url;
          link.target = '_self';

          link.style.left = left + 'px';
          link.style.top = top + 'px';
          link.style.width = width + 'px';
          link.style.height = height + 'px';

          linkLayer.appendChild(link);
        }
      }
    }

    loadPDF().catch(error => {
      console.error(error);

      document.body.innerHTML =
        '<div style="color:white;font-family:Arial;padding:30px;">Erreur de chargement du portfolio.</div>';
    });

  </script>

</body>
</html>
