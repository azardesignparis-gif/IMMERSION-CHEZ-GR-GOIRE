<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic Portfolio</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #status {
      padding: 25px;
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok {
      color: #7CFF8A;
    }

    .error {
      color: #FF7070;
    }
  </style>
</head>

<body>

<div id="status">1 — HTML chargé ✅</div>

<script>
  const status = document.getElementById('status');

  window.addEventListener('error', function(event) {
    status.innerHTML +=
      '\n\nERREUR JAVASCRIPT ❌\n' +
      (event.message || 'Erreur inconnue') +
      '\nFichier : ' + (event.filename || 'inconnu') +
      '\nLigne : ' + (event.lineno || 'inconnue');
  });

  window.addEventListener('unhandledrejection', function(event) {
    status.innerHTML +=
      '\n\nPROMESSE REJETÉE ❌\n' +
      String(event.reason);
  });

  status.innerHTML += '\n2 — JavaScript classique chargé ✅';
</script>

<script type="module">
  const status = document.getElementById('status');

  status.innerHTML += '\n3 — Module JavaScript chargé ✅';

  try {

    status.innerHTML += '\n4 — Tentative import PDF.js...';

    const pdfjsLib =
      await import('./pdfjs/pdf.mjs?v=diagnostic1');

    status.innerHTML +=
      '\n5 — PDF.js importé ✅';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      './pdfjs/pdf.worker.mjs?v=diagnostic1';

    status.innerHTML +=
      '\n6 — Worker configuré ✅';

    status.innerHTML +=
      '\n7 — Tentative chargement PDF...';

    const pdf =
      await pdfjsLib.getDocument(
        './IMMERSION_CHEZ_GREGOIRE.pdf?v=diagnostic1'
      ).promise;

    status.innerHTML +=
      '\n8 — PDF chargé ✅' +
      '\nNombre de pages : ' + pdf.numPages;

    status.innerHTML +=
      '\n9 — Tentative lecture page 1...';

    const page = await pdf.getPage(1);

    status.innerHTML +=
      '\n10 — PAGE 1 LUE ✅';

    status.innerHTML +=
      '\n\nDIAGNOSTIC TERMINÉ ✅';

  } catch (error) {

    status.innerHTML +=
      '\n\nERREUR DÉTECTÉE ❌\n' +
      'Nom : ' + (error.name || 'inconnu') +
      '\nMessage : ' + (error.message || String(error)) +
      '\n\n' + (error.stack || '');

  }
</script>

</body>
</html>
